name: Refresh hantavirus cases

on:
  schedule:
    # Every 6 hours (00:00, 06:00, 12:00, 18:00 UTC).
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-cases
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh cases from NewsAPI
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          NEWS_QUERY: hantavirus
          LOOKBACK_DAYS: "7"
        run: node scripts/refresh-cases.mjs

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/cases.js; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cases.js
          git commit -m "chore(data): refresh cases from NewsAPI ($(date -u +'%Y-%m-%dT%H:%MZ'))"
          git push
